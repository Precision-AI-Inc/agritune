# Deterministically reuses one offline variant most of the time, and takes the online branch for
# hybrid_online_probability of (sample, epoch) combinations. Requires feature_provider: online or
# hybrid, same as augmentation: online.
mode: hybrid
variant: 0
hybrid_online_probability: 0.3
geometric:
  horizontal_flip_probability: 0.5
  rotation_max_degrees: 15.0
photometric:
  brightness_range: [0.7, 1.3]
  contrast_range: [0.7, 1.3]
