# PSPNet-style pyramid pooling module: parallel adaptive-average-pool bins, upsampled and
# concatenated with the original grid, then fused into per-pixel class logits.
name: ppm
hidden_dim: 128
pool_sizes: [1, 2, 3, 6]
num_layers: 1                          # stacked 3x3 conv + ReLU blocks fusing the pooled features
