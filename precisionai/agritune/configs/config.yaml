# Root Hydra config — composes one variant per group below into a full training run.
#
# Usage: agritune train --config precisionai/agritune/configs/config.yaml decoder=token_fpn ...
# (or point --config at your own copy with different defaults/overrides baked in).
#
# See docs/configuration.md.

defaults:
  - dataset: agricultural_segmentation
  - encoder: fake
  - augmentation: none
  - feature_augmentation: none
  - feature_provider: cached
  - task: segmentation
  - decoder: mlp_probe
  - optimizer: adamw
  - scheduler: none
  - tracking: jsonl
  - _self_

run_root: runs
run_id: ???
feature_store_dir: ???
batch_size: 4
val_fraction: 0.2
seed: 0
checkpoint_top_k: 3

trainer:
  max_epochs: 1
  accumulation_steps: 1
  grad_clip_norm: null
  precision: fp32
  early_stopping_patience: null
  checkpoint_every_n_steps: null
