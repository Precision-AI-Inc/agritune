name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # torch's default PyPI wheel for Linux bundles the full CUDA runtime (several GB of
        # nvidia-*/triton packages) even though CI never touches a GPU — install the CPU-only
        # build first so `pip install -e ".[dev]"` is satisfied by it instead of pulling CUDA in.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run tests
        # Encoder credentials are never required: integration tests that would need
        # a live remote encoder are excluded, and unit tests exercise FakeEncoderBackend.
        run: python -m pytest -q --tb=short --no-header -m "not integration and not distributed" --cov-report=xml:coverage.xml

      - name: Coverage summary
        run: python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
