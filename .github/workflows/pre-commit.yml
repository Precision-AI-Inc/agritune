name: Pre-commit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        # See unit-test.yml: force the CPU-only torch wheel so this doesn't pull several GB of
        # CUDA runtime packages it will never use.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run pre-commit (all hooks)
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest
