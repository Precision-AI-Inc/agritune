name: Bug report
description: Report something that isn't working correctly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal config, CLI command, or code to reproduce the issue.
      placeholder: |
        agritune train dataset=... encoder=fake decoder=linear
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - Python version
        - `pip show pai-agritune` output
        - OS, GPU (if relevant)
        - Encoder backend used (fake / remote) — do not paste API keys
    validations:
      required: true
